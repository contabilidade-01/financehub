# CodeQL — análise estática de segurança (SAST) do código TypeScript/JavaScript.
# Resultados aparecem em Security > Code scanning no GitHub. Não bloqueia deploy.
name: CodeQL

on:
  push:
    branches: [financehub]
  pull_request:
    branches: [financehub]
  schedule:
    - cron: "30 8 * * 1" # segunda 05:30 em São Paulo

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analisar:
    name: Analisar código
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
