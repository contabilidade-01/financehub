# Cada subdomínio abre a sua página de vendas na raiz.
map $host $pagina_raiz {
  default                  /mei/;
  controle.gestaoempresa.com /mei/;
  pf.gestaoempresa.com     /pf/;
  pj.gestaoempresa.com     /pj/;
  mei.tudocontado.com.br   /mei/;
  pf.tudocontado.com.br    /pf/;
  pj.tudocontado.com.br    /pj/;
  mordomo.tudocontado.com.br /mordomia/;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = / { rewrite ^ $pagina_raiz last; }
  location /assets/ { expires 7d; add_header Cache-Control "public"; }
  location / { try_files $uri $uri/ =404; }
}
